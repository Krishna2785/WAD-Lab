<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    
    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        
        <!-- Sidebar -->

        <div class="col-md-2 sidebar">

            <h2 class="text-white text-center mt-3">
                Dashboard
            </h2>

            <ul class="nav flex-column mt-4">

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        Students
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        Courses
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        Settings
                    </a>
                </li>

            </ul>

        </div>



        <!-- Main Content -->

        <div class="col-md-10 main-content">

            <h1 class="mt-4">
                Admin Dashboard
            </h1>


            <!-- Cards -->

            <div class="row mt-4">


                <div class="col-md-3">

                    <div class="card card1">

                        <div class="card-body">

                            <h5>Total Students</h5>

                            <h2>500</h2>

                        </div>

                    </div>

                </div>



                <div class="col-md-3">

                    <div class="card card2">

                        <div class="card-body">

                            <h5>Total Courses</h5>

                            <h2>20</h2>

                        </div>

                    </div>

                </div>



                <div class="col-md-3">

                    <div class="card card3">

                        <div class="card-body">

                            <h5>Total Faculty</h5>

                            <h2>50</h2>

                        </div>

                    </div>

                </div>



                <div class="col-md-3">

                    <div class="card card4">

                        <div class="card-body">

                            <h5>Total Revenue</h5>

                            <h2>₹1L</h2>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
